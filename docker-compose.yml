services:
  db:
    image: postgres:15-alpine
    container_name: yashilqollar-db
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yashilqollar-redis
    restart: always
    # appendonly + volume — языки юзеров, статистика и состояния бота
    # переживают пересоздание контейнера (docker compose down/up).
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  web:
    container_name: yashilqollar-web
    build:
      context: .
      dockerfile: Dockerfile.web
    working_dir: "/usr/src/app"
    volumes:
      - .:/usr/src/app
      - ./media:/usr/src/app/media
    env_file:
      - .env
    environment:
      - PYTHONPATH=/usr/src/app
      - POSTGRES_HOST=db
    ports:
      - "127.0.0.1:8000:8000"
    # migrate НЕ запускаем автоматически: файлы миграций в репозитории отстают от реальной базы
    # (поля добавлялись вручную, см. sql/). Авто-migrate при старте мог уронить сайт или удалить
    # старые колонки. Миграции — только вручную, после бэкапа: docker compose exec web python manage.py migrate
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn dj_ac.wsgi:application --bind 0.0.0.0:8000
               --workers 3 --threads 4 --timeout 120 --access-logfile -"
    depends_on:
      db:
        condition: service_healthy

  bot:
    container_name: yashilqollar-bot
    build:
      context: .
      dockerfile: Dockerfile.bot
    working_dir: "/usr/src/app"
    volumes:
      - .:/usr/src/app
    env_file:
      - .env
    environment:
      - PYTHONPATH=/usr/src/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=db
      - DJANGO_SETTINGS_MODULE=dj_ac.settings
    command: python bot.py
    restart: always
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
  redis_data: