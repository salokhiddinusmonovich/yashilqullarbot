<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Команда · Yashil Qo'llar</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    --black:#000000;--deep:#03080a;--neon:#00FF88;--neon2:#00cc6a;--neon3:rgba(0,255,136,.08);--border:rgba(0,255,136,.14);--glass:rgba(0,255,136,.05);--white:#ffffff;--gray:#8a9a8e;--fh:'Unbounded',sans-serif;--fb:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--black);color:var(--white);font-family:var(--fb);overflow-x:hidden;}
#nav{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;align-items:center;justify-content:space-between;padding:1rem 3.5rem;background:rgba(0,0,0,.7);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);}
.nav-logo{display:flex;align-items:center;gap:.5rem;font-family:var(--fh);font-weight:900;font-size:.95rem;color:var(--neon);}
.container{max-width:1100px;margin:120px auto 60px;padding:0 2rem;}
.team-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));gap:1.5rem;}
.member-card{background:var(--glass);border:1px solid var(--border);border-radius:20px;padding:3rem 2rem;text-align:center;transition:all .3s ease;backdrop-filter:blur(10px);}
.member-card:hover{border-color:var(--neon);transform:translateY(-10px);box-shadow:0 10px 30px rgba(0,255,136,0.1);}
.member-av{width:110px;height:110px;border-radius:50%;border:3px solid var(--neon);margin:0 auto 1.5rem;display:flex;align-items:center;justify-content:center;font-size:3rem;background:var(--neon3);box-shadow:0 0 20px var(--neon3);}
.member-name{font-family:var(--fh);font-size:1.2rem;font-weight:700;margin-bottom:.5rem;}
.member-role{font-size:.7rem;color:var(--neon);text-transform:uppercase;letter-spacing:2px;font-weight:600;}
</style>
</head>
<body>
<nav id="nav">
  <a href="index.html" class="nav-logo">Yashil <b>Qo'llar</b></a>
  <a href="index.html" style="color:var(--gray);font-size:.8rem;">← На главную</a>
</nav>
<div class="container">
    <h1 style="font-family:var(--fh);font-size:2.5rem;margin-bottom:3rem;text-align:center;">Наша <span style="color:var(--neon)">Команда</span></h1>
    <div class="team-grid">
        <div class="member-card"><div class="member-av">👨‍💻</div><div class="member-name">Азиз</div><div class="member-role">Основатель</div></div>
        <div class="member-card"><div class="member-av">🌿</div><div class="member-name">Сардор</div><div class="member-role">Координатор</div></div>
        <div class="member-card"><div class="member-av">🎨</div><div class="member-name">Мадина</div><div class="member-role">Дизайнер</div></div>
    </div>
</div>
</body>
</html>d
